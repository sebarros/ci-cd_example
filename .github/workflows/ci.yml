name : despliegue automatico ci/cd

on:
  push:
    branches: [main]

jobs:
  despliegue:
    runs-on: ubuntu-latest
    steps:
      - name: checkout de codigo
        uses: actions/checkout@v4
      - name: acceso a AWS
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: "${{ secrets.AWS_ACCESS_KEY_ID }}"
          aws-secret-access-key: "${{ secrets.AWS_SECRET_ACCESS_KEY }}"
          aws-region: "${{ secrets.AWS_REGION }}"
          aws-session-token: "${{ secrets.AWS_SESSIONS_TOKEN }}"
      - name: login a ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2
      - name: build and push ECR
        env:
          REGISTRY: "${{ steps.login-ecr.outputs.registry }}"
          REPO: "${{ secrets.ECR_REPOSITORY }}"
          IMAGE_TAG: "${{ github.sha }}"
        run: |
          IMAGE= "$REGISTRY/$REPO:$IMAGE_TAG"
          docker build -t "$IMAGE" . && docker push "$IMAGE"
      - name: despliegue automatico
        env:
          REGISTRY: "${{ steps.login-ecr.outputs.registry }}"
          REPO: "${{ secrets.ECR_REPOSITORY }}"
          IMAGE_TAG: "${{ github.sha }}"
          AWS_REGION: "${{ secrets.AWS_REGION }}"
        run: |
          aws ssm send-command \
            --instance-ids "${{ secrets.INSTANCE_ID }}" \
            --document-name "AWS-RunShellScript" \
            --parameters "commands = [
            \"aws ecr get-login-password --region "$AWS_REGION" | docker login --username AWS password-stdin $REGISTRY\",
            \"sudo docker pull $REGISTRY/$REPO:$IMAGE_TAG\",
            \"sudo docker stop suscripciones || true\",
            \"sudo docker rm suscripciones || true\",
            \"sudo docker run -d --name suscripciones -p 8080:8080 $REGISTRY/$REPO:$IMAGE_TAG\"
            ]"