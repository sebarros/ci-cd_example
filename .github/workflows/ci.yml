
name: despliegue automatico ci/cd

on:
  push:
    branches: [main]

jobs:
  despliegue:
    runs-on: ubuntu-latest

    steps:
      - name: checkout de codigo
        uses: actions/checkout@v4

      - name: acceso a AWS
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}

      - name: login a ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: build and push ECR
        env:
          REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          REPO: ${{ secrets.ECR_REPOSITORY }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          IMAGE="$REGISTRY/$REPO:$IMAGE_TAG"
          docker build -t "$IMAGE" .
          docker push "$IMAGE"

      - name: despliegue automatico
        env:
          REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          REPO: ${{ secrets.ECR_REPOSITORY }}
          IMAGE_TAG: ${{ github.sha }}
          AWS_REGION: ${{ secrets.AWS_REGION }}
          INSTANCE_ID: ${{ secrets.INSTANCE_ID }}
        run: |
          IMAGE="$REGISTRY/$REPO:$IMAGE_TAG"

          COMMANDS=$(jq -n \
            --arg region "$AWS_REGION" \
            --arg registry "$REGISTRY" \
            --arg image "$IMAGE" \
            '{
              commands: [
                "aws ecr get-login-password --region " + $region + " | sudo docker login --username AWS --password-stdin " + $registry,
                "sudo docker pull " + $image,
                "sudo docker stop suscripciones || true",
                "sudo docker rm suscripciones || true",
                "sudo docker run -d --restart unless-stopped --name suscripciones -p 8080:8080 " + $image
              ]
            }')

          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name "AWS-RunShellScript" \
            --parameters "$COMMANDS" \
            --query "Command.CommandId" \
            --output text)

          aws ssm wait command-executed \
            --command-id "$COMMAND_ID" \
            --instance-id "$INSTANCE_ID"

          STATUS=$(aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" \
            --instance-id "$INSTANCE_ID" \
            --query "Status" \
            --output text)

          if [ "$STATUS" != "Success" ]; then
            aws ssm get-command-invocation \
              --command-id "$COMMAND_ID" \
              --instance-id "$INSTANCE_ID" \
              --query "StandardErrorContent" \
              --output text
            exit 1
          fi

          echo "Despliegue completado correctamente."